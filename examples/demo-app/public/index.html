<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Acme Notes</title><link rel="stylesheet" href="/app.css"><script src="/app.js"></script></head>
<body>
  <header><span class="brand">Acme Notes</span><a href="/" data-testid="nav-notes">Notes</a><a href="/settings" data-testid="nav-settings">Settings</a><a href="/about" data-testid="nav-about">About</a></header>
  <main>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h1>Your notes</h1>
      <button id="new-note" data-testid="new-note">New note</button>
    </div>
    <input id="search" data-testid="search" placeholder="Search notes">
    <section id="notes" data-testid="note-list" style="margin-top:12px"></section>
  </main>
  <dialog id="new-note-dialog" data-testid="new-note-dialog">
    <form method="dialog" id="new-note-form">
      <h2>New note</h2>
      <label for="note-title">Title</label><input id="note-title" data-testid="note-title">
      <label for="note-body">Body</label><textarea id="note-body" data-testid="note-body" rows="4"></textarea>
      <p id="form-error" class="error"></p>
      <div style="display:flex;gap:8px;justify-content:flex-end"><button value="cancel" type="button" id="cancel-note">Cancel</button><button id="create-note" data-testid="create-note" type="submit">Create</button></div>
    </form>
  </dialog>
  <script>
    let notes = [];
    function render() {
      const query = document.getElementById('search').value.toLowerCase();
      const visible = notes.filter(n => (n.title + ' ' + n.body).toLowerCase().includes(query));
      document.getElementById('notes').innerHTML = visible.length
        ? visible.map(n => `<div class="note-card"><a href="/note?id=${n.id}">${acme.escape(n.title)}</a><div>${n.tags.map(t => `<span class="tag">${acme.escape(t)}</span>`).join('')}</div></div>`).join('')
        : '<p>No notes match your search.</p>';
    }
    acme.getJson('/api/notes').then(list => { notes = list; render(); });
    document.getElementById('search').addEventListener('input', render);
    const dialog = document.getElementById('new-note-dialog');
    document.getElementById('new-note').addEventListener('click', () => dialog.showModal());
    document.getElementById('cancel-note').addEventListener('click', () => dialog.close());
    document.getElementById('new-note-form').addEventListener('submit', async event => {
      event.preventDefault();
      const response = await fetch('/api/notes', { method: 'POST', headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ title: document.getElementById('note-title').value, body: document.getElementById('note-body').value }) });
      if (!response.ok) { document.getElementById('form-error').textContent = 'A title is required.'; return; }
      notes.unshift(await response.json());
      dialog.close();
      render();
    });
  </script>
</body>
</html>
